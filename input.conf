# volume on the vertical arrows. w/s further down are a second pair doing
# exactly the same thing - see that block.
# no-osd suppresses mpv's built-in horizontal bar; the vertical one is drawn
# by scripts/vertical-volume.lua instead.
UP   no-osd add volume 5
DOWN no-osd add volume -5

# horizontal arrows = 6 second steps (mpv's default is 5).
# 'exact' because a plain 6s seek lands on the nearest keyframe: measured
# 2026-08-25 on a file with 5s keyframes it gave 10.0s, 7.0s and 7.48s from
# three different start points, where exact gives 6.0s every time.
RIGHT  seek 6 exact
LEFT   seek -6 exact

# cmd + horizontal arrows = 10 second steps.
# 'exact' for the same reason as the 6s keys above - a plain 10s seek on a
# sparse-keyframe file drifts to 15s.
Meta+RIGHT  seek 10 exact
Meta+LEFT   seek -10 exact

# a / d = small 3 second steps (d overrides mpv's default 'cycle deinterlace').
# 'exact' because a plain 3s seek snaps to the nearest keyframe, which on a
# typical file overshoots to 4-10s and makes the step feel wrong.
a seek -3 exact
d seek 3 exact

# option/alt + horizontal arrows = 1 minute jumps (both Option keys).
# Requires input-right-alt-gr=no in mpv.conf, otherwise macOS strips the
# modifier and these never fire. Verified by key trace 2026-08-25.
Alt+RIGHT  seek 60 exact
Alt+LEFT   seek -60 exact

# the 60s seek that UP/DOWN used to do, also kept here
PGUP   seek 60 exact
PGDWN  seek -60 exact

# subtitles with c — forces them visible, then cycles the available
# tracks (track 1 -> track 2 -> ... -> off -> back round)
c set sub-visibility yes; cycle sub

# x / z step through the playlist (when several files are opened at once).
# These override mpv's defaults, where z/x were subtitle-delay -0.1/+0.1.
#
# write-watch-later-config first, because save-position-on-quit only fires on
# QUIT - stepping to another file just abandons where you were. Measured
# 2026-08-27 without it: seek to 42s, x, then z, and the file restarted at 0.0s.
# scripts/shuffle-mode.lua already does the same before its random jump.
#
# While shuffle mode is ON these two are taken over by shuffle-mode.lua:
# x jumps to a random file and z walks BACK through the shuffle history - the
# video you actually watched before this one. Plain playlist-prev would give
# the file sitting before this one in playlist order, which once the order is
# random is almost never where you just came from.
x write-watch-later-config; playlist-next
z write-watch-later-config; playlist-prev

# l reveals the playing file in Finder: its folder opens in a new window with
# the file already selected, as if you had clicked it there. This overrides
# mpv's default l, which set A-B loop points - never used here.
# Provided by scripts/reveal-in-finder.lua
l script-binding reveal-in-finder

# 0 wipes the saved playback positions (watch_later) of the files in the
# playlist on screen, and nothing else - open a 600-video folder and 0 resets
# those 600, leaving every other saved position alone. Press twice: the first
# press only arms it, since a bare key is easy to hit by accident and there is
# no undo. Overrides mpv's default 0 = volume +2.
# (Cmd+0 was tried first but macOS's menu bar eats it before mpv's input
# layer sees the key - verified by key trace 2026-08-25.)
#
# Note that autocreate-playlist=filter in mpv.conf means opening a single video
# still builds a playlist out of its whole folder, so "this playlist" is
# usually "this folder" even when nothing was opened as a set.
#
# The older wipe-everything reset is still there as reset-all-watch-later,
# left unbound on purpose. Bind it if you want it back.
# Provided by scripts/watch-later-reset.lua
0 script-binding reset-playlist-watch-later

# Cmd+z toggles shuffle mode (random next instead of sequential).
# Provided by scripts/shuffle-mode.lua
Meta+z script-binding toggle-shuffle

# w and s are a second volume pair, for one hand away from the arrow keys.
# Same 5 step and same no-osd as UP/DOWN above. Nothing extra is needed to
# get the vertical bar: vertical-volume.lua observes the 'volume' property
# itself, so it draws whichever key did the changing.
# These two used to do nothing. By default s took a screenshot (which
# silently failed: mpv's working directory when launched from Finder is /,
# which isn't writable) and w nudged panscan - cropping now lives on g.
w no-osd add volume 5
s no-osd add volume -5

# 9 was mpv's default volume-down, in 2 steps and with its own horizontal OSD
# bar. Its partner 0 is the watch-later reset and volume now has two
# deliberate pairs, so 9 is switched off rather than left as a third path in.
# Not switched off, and still live: mpv's / and * (and the KP_DIVIDE and
# KP_MULTIPLY numpad equivalents), and the mouse wheel. All are 2-step and
# all show the built-in horizontal bar rather than the vertical one.
9 ignore

# v cancels subtitles outright, rather than mpv's default "hide but keep the
# track selected". Because 'cycle sub' wraps from none back to track 1, the
# next press of c starts over as if subtitles had never been turned on.
v set sid no; show-text "Subtitles off"

# g toggles zoom to fill: crops the letterbox bars off a film that is wider
# than the screen, so the picture fills the panel instead of floating between
# two black bands. The trade is that the sides are cut off. Measured
# 2026-08-26 on a 1920x804 (2.39:1) source in a 1280x800 (16:10) window:
# bars of 132px top and bottom go to 0, and 315px is cropped off each side.
#
# Bare 'g' is mpv's own prefix for the g-p / g-a / g-d ... selector menus
# (playlist, audio track, audio device, chapter, watch history). Binding g on
# its own overrides mpv's default 'g ignore', and mpv then fires it the
# instant the key is pressed instead of waiting to see if a second key
# follows - verified 2026-08-26 by key trace: pressing g then p ran panscan
# and pause as two separate actions, so the g-* menus are no longer
# reachable. Nothing here used them.
#
# The integer 1/0 in the comparisons is deliberate: ${panscan} expands to
# "0", not "0.000000", so ==0.000000 would silently match nothing and the
# OSD message would come out empty.
#
# panscan is one of the 47 properties watch-later saves, so a film you zoom
# is still zoomed when you resume it. To make the zoom per-session instead,
# add 'watch-later-options-remove=panscan' to mpv.conf.
g no-osd cycle-values panscan 1.0 0.0; show-text "${?panscan==1:Zoom to fill}${?panscan==0:Original aspect}"

# p switches how fullscreen behaves: covering this desktop, or in its own
# Space. The script picks this automatically per display - own Space on the
# built-in panel, this-desktop on any external screen, because a fullscreen
# Space bound to another display makes f shuttle between Spaces instead of
# leaving fullscreen. p overrides that choice until the displays change.
# Overrides mpv's default p = cycle pause; Space still pauses.
# Provided by scripts/fullscreen-mode.lua
p script-binding toggle-fullscreen-mode

# Return does nothing. By default it was playlist-next, i.e. the same as x, so
# a stray Return jumped to the next video - easy to hit by accident and there
# is no way back to where you were.
ENTER ignore

# > and < are mpv's defaults for next/previous file - duplicates of x and z,
# and unlike those two they skip without saving your position first. They need
# Shift, so they are harder to hit by accident than Return was, but there is no
# reason to keep a second, worse copy of keys that already exist.
# Still live and doing the same thing: the mouse's back and forward buttons
# (MBTN_BACK / MBTN_FORWARD).
> ignore
< ignore
