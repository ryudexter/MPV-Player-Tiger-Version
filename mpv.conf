# ---- buffering ------------------------------------------------------------
# Helps a little when streaming a URL directly, but measured on 2026-08-25:
# mpv/ffmpeg's HTTP reader only prefetches at ~1x real time, so this cannot
# build a real head start. For buffer-free playback use `ytwatch` instead,
# which downloads via yt-dlp (~35x real time) and plays the local file.
#
# 'auto', not 'yes': yes turns the cache on for LOCAL files too, and with
# cache-on-disk that means mpv reads a movie off the SSD and writes a copy
# straight back to the same SSD. Measured 2026-09-01 on a local 1080p x265
# file: demuxer-cache-state reported file-cache-bytes = 1703967004, i.e. 1.7 GB
# written per film for no benefit at all. It was invisible because
# demuxer-cache-unlink-files=immediate unlinks those files the moment they are
# created, so they never show up in ~/.cache/mpv.
#
# 'auto' means network streams only - which is all this section was ever for.
# Local files then read straight from disk, and the demuxer still keeps the 600s
# of read-ahead below in RAM (measured 195 MB on that file). Same 0 dropped
# frames either way, and CPU measured lower without the writes.
cache=auto
cache-on-disk=yes
demuxer-cache-dir=~/.cache/mpv
demuxer-cache-unlink-files=immediate
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=1GiB
demuxer-readahead-secs=600

# ---- youtube -------------------------------------------------------------
script-opts=ytdl_hook-ytdl_path=/opt/homebrew/bin/yt-dlp
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

# ---- window --------------------------------------------------------------
keep-open=no

# ---- input ----------------------------------------------------------------
# By default mpv treats the RIGHT Option key as AltGr (character composition),
# which sends it through the macOS text-input path and strips the modifier —
# Alt+RIGHT then arrives as a bare RIGHT and the binding never fires.
# Disabling it makes Option a real Alt modifier again — for BOTH the left and
# the right Option key, despite the option's name. Verified by key trace
# 2026-08-25: without this, Option+RIGHT reaches mpv as a bare RIGHT.
input-right-alt-gr=no

# ---- subtitles ------------------------------------------------------------
# Never turn subtitles on by themselves. Tracks (including external .srt
# files) are still loaded and available — they're just not selected, so the
# 'c' binding in input.conf can switch them on when wanted.
sid=no

# Releases often park subtitles in a Subs/ subfolder under names that match
# nothing about the video - "3_English.srt", "English.srt". mpv looks only
# beside the video, and by default only for a file whose stem matches it
# exactly, so those never loaded at all. Four films in this library are
# affected, one of them with 35 subtitle files.
#
# sub-file-paths adds the subfolder to the search, and sub-auto=all is required
# with it: 'exact' would reject every one of those names. Measured 2026-09-01 on
# Project Hail Mary - 1 subtitle track before, 36 after. 'all' is safe here only
# because the library is one folder per film; in a flat folder it would drag in
# every unrelated .srt beside it.
#
# The track count is what scripts/subtitle-pick.lua exists to absorb: c picks
# the best English track in one press, Alt+c opens mpv's searchable list.
sub-file-paths=Subs
sub-auto=all

# Lift the subtitles clear of the seek bar. Both were landing in the same band
# of the window: measured at 1280x720, the bar drew across rows 660-684 and a
# one-line subtitle across 663-680, so the words sat entirely INSIDE the bar
# and the chapter-marker triangles cut straight through them. A two-line
# subtitle overlapped by 21 rows.
#
# It has to be fixed by moving them apart, because the draw order cannot be
# changed: mpv keeps subtitles and the OSD bar both in the builtin OSD, whose
# internal Z order is fixed, and the bar wins. Drawing our own bar from a
# script would be worse, not better - script overlays (osd-overlay, like the
# time readout in mouse-progress.lua) are always ABOVE subtitles.
#
# So the subtitles move rather than the bar: the bar is transient, but the
# bottom-left time readout is pinned to the very bottom edge, so sliding the
# bar down would just collide with that instead.
#
# UPDATE 2026-09-25: the bar DOES slide down now, but only into the black strip
# under the picture, and only when a video leaves one (scripts/bar-in-strip.lua).
# The readout moves beside it there. The subtitles never had to move out of its
# way - they were already above it - but with the bar gone from this band, 68
# was clearing nothing, so while the bar is in the strip the same script brings
# them DOWN to sit just above it (on 16:9: onto the bottom edge of the picture).
# This line is still the value that counts with no strip, when the bar is back
# at the 0.90 below, right where it was when the numbers above were measured.
#
# 68 is double the default 34, in scaled pixels, so it tracks the window size
# the way the bar does. Measured after: one line 624-651, two lines 586-645,
# both clear of the bar with 8 and 14 rows to spare. Extra lines grow upward,
# so they stay clear too.
#
# Deliberately NOT sub-pos: that is one of the properties watch-later saves,
# so a per-file value would silently override this. sub-margin-y is not.
sub-margin-y=68

# ---- on-screen seek bar ----------------------------------------------------
# The bar that flashes when seeking. mpv's default align-y of 0.5 puts it at
# 75% of screen height, floating oddly in the middle. 0.90 drops it near the
# bottom (1.0 sits flush on the edge and gets clipped).
# Since 2026-09-25 this is the FALLBACK position. When the video leaves a black
# strip under the picture tall enough to hold the bar, scripts/bar-in-strip.lua
# moves it down into that strip, and back here the moment there is none.
# Colours are #AARRGGBB: CC = ~80% opaque. Was 70 (~44%), which washed out
# badly over bright footage — the bar sat on a pale tapestry shot and nearly
# vanished. 80% still lets a little video through so it does not look pasted on.
# NOTE: osd-color/osd-border-color are shared with OSD *text* messages, so
# those pick up the same opacity — there is no bar-only colour option.
osd-bar-align-y=0.90
# (quotes are required: an unquoted # starts a comment in mpv.conf)
# green (#50DC82) at 80% opacity. Was #7050DC82 (44%), and #70FFFFFF (white)
# before that. The hue is unchanged — only the alpha moved.
osd-color="#CC50DC82"
# The dark outline behind the bar and the text. Raised from 40 (25%) to 99
# (60%): on a light background the green alone has nothing to separate it from
# the picture, and the outline is what actually makes it readable there.
osd-border-color="#99000000"
# bar size: w is % of screen width, h is % of screen height.
# These are mpv's defaults, kept explicit so they're easy to nudge:
# smaller = w55 h1.5, larger = w85 h4.2
osd-bar-w=75
osd-bar-h=3.125
osd-bar-outline-size=0.5

# Blank the text that comes with show-progress, so it draws the bar and nothing
# else. scripts/mouse-progress.lua then paints the elapsed/duration readout
# itself, down at the bottom under the bar.
# Why not just osd-align-y=bottom: that is global, and would drag every OSD
# message ("Subtitles off", "Zoom to fill", "Shuffle: ON") down there too. Only
# the timer was wanted at the bottom; messages stay in the top-left corner.
# A single space, not an empty string: empty means "use mpv's built-in text".
# osd-msg3 is only consulted at OSD level 3, which is what show-progress uses
# briefly; the level-1 OSD that seeking draws is untouched.
osd-msg3=" "

# ---- resume where you left off --------------------------------------------
# Save playback position on quit and restore it next time the file is opened.
# Shift+Q (quit-watch-later) already did this on demand; this makes every
# quit do it. Positions live in the watch_later dir (see --watch-later-dir).
save-position-on-quit=yes
# ...but do NOT restore the subtitle track: sid/sub-visibility are in the
# default watch-later-options, which would re-enable subtitles on reopen and
# quietly defeat sid=no above.
# (one entry per line: -remove takes a single item, a comma-separated list
# is treated as one literal string and silently matches nothing)
watch-later-options-remove=sid
watch-later-options-remove=sub-visibility
# ...and do NOT restore volume or mute per file. Both are in mpv's default
# watch-later-options, so every file remembered its own level - which now
# fights ReplayGain above: a file once turned up because it was quiet keeps
# that boost AND gets normalised, so it plays too loud. There should be one
# sound level, not one per video. scripts/global-sound.lua keeps that single
# level across launches - the volume only: mute is forgotten when mpv quits.
watch-later-options-remove=volume
watch-later-options-remove=mute
watch-later-options-remove=secondary-sid
watch-later-options-remove=secondary-sub-visibility
# ...and do NOT restore playback speed. speed is in mpv's default
# watch-later-options too, so a file watched once at 4x reopened at 4x for
# good - and because save-position-on-quit is on above, every quit wrote it.
# Speed is a "right now" choice, not a property of the file: every open
# starts at 1x. Backspace still resets it mid-file.
watch-later-options-remove=speed

# ---- fullscreen ------------------------------------------------------------
# Use the legacy fullscreen instead of macOS's native one. Native fullscreen
# moves mpv into its own Space (the slide animation, separate desktop, and it
# leaves a gap in Mission Control). "no" makes the window simply cover the
# current desktop the way VLC does, staying on the Space you're already on.
# CHANGED 2026-08-27 back to native fullscreen, to kill the light hairline on
# the screen edge. Measured from Cmd+Shift+3 captures at 3456x2234: a 2-pixel
# (1 point) band of 20% white on all four edges - (51,51,51) over the black
# letterbox, and content lightened by exactly 0.8*c + 0.2*255 elsewhere. It is
# a window edge macOS draws, and it is NOT governed by --border: setting
# border=no in fullscreen (verified applied, with a fresh mpv start) left the
# band byte-identical. mpv's own framebuffer was separately measured clean.
# Legacy fullscreen keeps a window, so it keeps the edge; native fullscreen has
# no window to draw one on, which is why VLC never showed it.
# CONFIRMED 2026-08-27: with native fullscreen the band is gone.
# The cost is what native-fs=no was avoiding: mpv gets its own Space and leaves
# a gap in Mission Control. Judged worth it to be rid of the hairline.
# macos-fs-animation-duration is left at macOS's own slide duration. Set it to
# a number of ms (0 to 1000) to speed it up, or 0 to make fullscreen snap.
native-fs=yes

# ---- folder as a playlist --------------------------------------------------
# Opening one video queues every other video in the same folder, so x/z and
# shuffle work across the whole folder without selecting anything.
# Measured 2026-08-25 on a 1200-file folder: playlist built in 0.16s.
autocreate-playlist=filter
# ...videos only. The default list also pulls in image, archive and playlist
# files, which put cover.jpg / poster art into the queue as still "videos".
directory-filter-types=video

# ---- end of the folder: start it again, do not quit ------------------------
# Without this, finishing the last video in the folder ends the whole session.
# keep-open=no above means the final entry terminates mpv, and because this is a
# single-instance setup that takes the window, the playlist, the shuffle history
# and the process with it - the next open is a cold start. Measured 2026-09-20
# on a 3-clip folder: mpv played 0,1,2 and exited (rc=0) 9s in, at the end of
# the last clip.
#
# inf = wrap back to the first entry and keep going, so the folder cycles and
# the session stays up. Measured after: 0,1,2,0,1,2,0,1,2 with the process still
# alive and every clip playing in full.
#
# It does NOT spin through already-watched files: a file that reaches its own
# end has its watch_later entry deleted, so the next lap starts it at 0. Only a
# file skipped part-way still carries a position - it resumes there once, plays
# out, and is clean from then on (measured: re-entered at 1.3s of a 2s clip,
# then 0.0 on every later lap).
#
# WARNING: the wrap is taken at the end of the LAST playlist entry, and a
# keep-open pause wants that same instant - whoever holds mpv there first
# decides what plays next. scripts/shuffle-mode.lua needs it, to deal the next
# random video, so the two genuinely compete. keep-open=yes LOSES that race,
# and with it shuffle degraded to plain sequential play (measured on an 8-clip
# folder: 0..7,0..7 with this line, against 0..7,5,6,7,2,3,4 without it).
# keep-open=always WINS it, because it stops mpv at the end of every file, long
# before the playlist can run out - measured with this line on: 0,3,1,5,4,7,6,2
# then 3,0,7,6,1,5,2,4. shuffle-mode.lua therefore forces "always" while it is
# enabled and leaves loop-playlist alone; the loop simply never comes up while
# shuffle is on, and takes over again the moment shuffle is off.
loop-playlist=inf

# ---- frame timing ----------------------------------------------------------
# Sync video to the display clock instead of the audio clock (mpv's default).
#
# This panel runs at 120 Hz and films are 23.976 fps. Measured 2026-09-01:
# vsync-ratio comes out at exactly 5.0, but 120/23.976 is 5.005, so with
# video-sync=audio that leftover 0.005 has to be absorbed by an occasional
# repeated frame - a small hitch roughly every 8 seconds. display-resample
# locks to the display and nudges audio by ~0.1% to match, which is inaudible.
#
# Measured with it on, same file: vsync-jitter 0.0296, frame-drop-count 0,
# about 2% more CPU on top of 8%. Cheap.
#
# Deliberately NOT interpolation=yes: at a clean 5:1 ratio there is nothing for
# it to smooth, and it would only soften the picture.
video-sync=display-resample

# ---- picture quality -------------------------------------------------------
# mpv's bundled high-quality profile. Swaps the default scaler for
# ewa_lanczossharp, which is visibly better when upscaling 720p/1080p to a
# Retina panel, and improves HDR tone mapping. Costs GPU, not CPU.
profile=high-quality

# ---- decoding --------------------------------------------------------------
# Use the Mac's dedicated video decoder instead of doing the work on the CPU.
# Output is bit-identical - decoding is deterministic, so this is not a
# quality tradeoff. Measured 2026-08-25 on 1080p: 19.6% CPU -> 2.6% CPU.
# "auto-safe" only uses hardware where it is known good, and falls back to
# software silently for anything it cannot handle (e.g. VP9 on this machine).
hwdec=auto-safe

# ---- mouse cursor ----------------------------------------------------------
# Hide the pointer after 1s of stillness.
#
# 1000ms is also mpv's default, but it is set explicitly because it is no longer
# only mpv's business: scripts/osc-idle-hide.lua restores the pointer to
# whatever is set here, so this is the value that comes back when the mouse
# moves again.
#
# The default never actually fired on its own. mpv restarts the countdown on ANY
# movement, and a finger resting on a trackpad never quite stops, so a pointer
# parked over the picture stayed lit through a whole film. The script is what
# makes it happen - it ignores sub-4px twitches, so the countdown finishes - and
# it hides the cursor on a 1s timer of its own, separate from the 2s the OSC
# gets, since a stray pointer is pure clutter and the controls are not.
cursor-autohide=1000

# ---- on-screen controller -------------------------------------------------
# The OSC (the bar with buttons, filename and timers) normally appears on any
# mouse movement anywhere in the window. deadzonesize=1 means "only show up
# when the mouse actually hovers it", so it takes moving the pointer down to
# the bottom edge. Casual mouse movement instead brings up just the slim seek
# bar - see scripts/mouse-progress.lua.
#
# -append, NOT a plain script-opts= line: script-opts assigns the whole list,
# so a second one would silently drop the ytdl_hook path set at the top.
script-opts-append=osc-deadzonesize=1

# ---- window size ------------------------------------------------------------
# Cap the window at 90% of the screen. Without this mpv sizes the window to the
# video, and a 1080p file on a 1920x1080 screen gives a window exactly as big as
# the display - so pressing f changed nothing visible and fullscreen looked
# broken. Diagnosed 2026-08-28 on the AirPlay-mirrored TV: with fullscreen
# forced OFF over IPC the window still measured 1920x1080, identical to
# fullscreen. The keypress was always arriving and always toggling.
# "larger" means it only ever shrinks an oversized window; small videos open at
# their own size as before.
autofit-larger=90%x90%

# ---- audio language ---------------------------------------------------------
# Play the English soundtrack on a film that ships several languages.
#
# mpv has no preference of its own: it takes the track the file flags as
# default, whatever language that is. Measured 2026-09-03 on a test file with
# Turkish (flagged default), English and Japanese audio - mpv selected Turkish.
#
# One code is enough. mpv normalises language tags through its own ISO 639
# table, so 'en' matches a track tagged en, eng or en-US alike - verified on
# that same file, where alang=en and alang=eng both selected the eng track.
#
# This is the right place for the preference because it runs inside mpv's track
# selection, before any decoder is created, so nothing switches once playback
# has started. What it cannot do is read a track that carries no language tag
# at all, or tell a film's English audio from an English commentary - both of
# those are handled by scripts/audio-pick.lua, and l in input.conf steps
# through whatever other languages the file has.
alang=en

# ---- audio loudness ---------------------------------------------------------
# Files ripped/encoded by different people sit at wildly different loudness, so
# shuffling between them means riding the volume key. Two independent fixes:
#
# 1. ReplayGain. Files can carry a tag saying "this track is 6.2 dB louder than
#    the reference", and mpv then applies the inverse so everything lands on the
#    same perceived loudness. This is the good fix: exact, free at playback time,
#    and it does not touch the dynamics inside the file. `track` normalises each
#    file on its own (right for a shuffled mix); `album` would preserve the
#    quiet-intro/loud-chorus relationship within an album instead.
#    Only helps files that actually carry the tag - most music from Bandcamp,
#    Apple Music rips and anything tagged with rsgain does; raw video files
#    almost never do. Untagged files simply play at their own level.
replaygain=track
# Without this, a track needing a big positive gain can be pushed past 0 dBFS
# and clip. mpv's default is `no` (allow clipping); yes = back the gain off
# just enough to stay clean.
replaygain-clip=yes
# What to assume for files with no tag at all. 0 = leave them alone. If your
# untagged files feel consistently quieter than your tagged ones, a small
# positive number here (try 3) lifts only them.
replaygain-fallback=0

# 2. Downmix normalisation. A separate, very common cause of "this movie is
#    quiet": 5.1 tracks spread their energy across six channels, and folding
#    them into stereo without compensation loses several dB against a file that
#    was stereo to begin with. This restores it.
audio-normalize-downmix=yes

# Headroom for the two above plus the volume keys. mpv's default is 130%.
volume-max=150

# ---- macOS 27: keep CoreAudio, and with it a 0.2s buffer --------------------
# Added 2026-09-16, after the macOS 27 upgrade broke two keys at once.
#
# What happened: macOS 27 refuses the channel-layout call mpv makes while
# setting up its CoreAudio output, but only when the samples handed to the
# audio unit are PLANAR:
#     [ao/coreaudio] unable to set the input channel layout on the audio unit
#                    ([206][255][255][255]/-50)        (-50 = paramErr)
# mpv then falls back to its AVFoundation output without saying so, and that is
# not a quiet substitution - that driver holds a fixed TWO SECOND buffer:
#     [ao/avfoundation] using soft-buffer of 96000 samples.   96000/48000 = 2.0s
# where CoreAudio uses 9600 samples (0.2s) plus 13.7ms of device latency.
#
# Everything behind that buffer ran two seconds late, which is exactly how this
# showed up from the keyboard:
#   - the volume keys. mpv applies volume in its filter chain, BEFORE the output
#     buffer, so two seconds of audio at the old level was already queued and
#     had to play out first.
#   - '/' (skip to silence). That script runs the file at speed 100 and watches
#     silencedetect, so a 2s output buffer leaves the detector running ~200
#     SECONDS of film ahead of the position mpv reports. Measured on a real
#     episode, pressing '/' at 0:00: it landed at 54.6s and at 330.9s across
#     runs instead of the 6.04s silence that is genuinely next (ffmpeg's own
#     silencedetect is the oracle). With this line: 6.09s and 6.17s, in 0.3s.
#
# The fix is to hand the audio unit an INTERLEAVED format, which macOS 27 does
# accept. It is lossless and costs nothing: the decoder already produces 32-bit
# float, and this changes only how those samples sit in memory (planar 'floatp'
# -> interleaved 'float'), not their depth or their rate. Verified across the
# library - stereo, 5.1 and 5.1(side), in AAC, DTS and E-AC-3 - all back on
# CoreAudio at 9600 samples.
#
# Upstream bug: https://github.com/mpv-player/mpv/issues/18384 (still open).
# DELETE THIS LINE once mpv ships a fix. It is a workaround, not a setting
# worth keeping: planar is mpv's own default and costs one conversion less.
audio-format=float

# The same macOS 27 refusal also fires on a MONO file whatever the sample
# format, because a mono layout goes over as a description list rather than a
# layout tag and that blob is refused too. Asking for stereo output on those
# files, and only those, keeps them on CoreAudio. Doing it globally is not an
# option: it would fold every 5.1 film down to two channels on the way in,
# before audio-normalize-downmix above ever sees it.
# Same lifetime as the line above - both go when mpv is fixed.
[mono-on-macos-27]
profile-cond=get("current-tracks/audio/demux-channel-count", 2) == 1
profile-restore=copy-equal
audio-channels=stereo
