# Options for scripts/skiptosilence.lua (bound to / in input.conf).

# Maximum loudness that still counts as "silence", in dB. Upstream default.
# -60 is very sensitive, -10 tolerant of noise. -30 is the value the 2026-09-03
# measurements were taken at: it finds the gap after a title sequence without
# stopping on quiet dialogue.
quietness=-30

# Minimum length of that quiet patch before it counts, in seconds.
duration=0.1

# Mute while fast-forwarding. Upstream defaults this to no, but at 100x the
# audio is a burst of noise, and the skip is over in well under a second.
mutewhileskipping=yes
