# thumbfast settings. See scripts/seek-thumbnail.lua for how it is driven.

# ABSOLUTE path, deliberately. thumbfast spawns a second mpv to decode preview
# frames, and by default it does that by the bare name "mpv" - which relies on
# PATH. A GUI app launched from Finder does NOT inherit the shell PATH, so
# under mpv.app /opt/homebrew/bin is not on it and the spawn fails silently:
# no thumbnail, no error. Works fine from a terminal, which is what makes it
# such an easy trap to miss.
mpv_path=/opt/homebrew/bin/mpv

# Let the helper process exit once you stop hovering the bar, rather than
# leaving it resident for the whole film. 0 would mean "never quit".
quit_after_inactivity=30

# Do not spawn it on file load - nothing runs until the bar is actually
# hovered. Keeps opening a video exactly as cheap as it was before.
spawn_first=no

# Streams are off: on a network source every preview is a fresh range request,
# which is slow and wasteful. Local files only.
network=no

# Preview size in pixels, scaled up automatically on a hidpi panel.
max_height=240
max_width=240
