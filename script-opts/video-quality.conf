# Which videos get the sharper-picture shaders (see scripts/video-quality.lua).
#
# Semicolon-separated. Each entry is matched as plain text anywhere in the
# file's full path, ignoring case, so a folder name on its own is enough.
# Add a line's worth of text here when a new animated series joins the library.
#
# NOTE: no spaces around the '=' - mpv silently ignores "key = value".
animation_paths=Solo Leveling;Attack on Titan;One Punch Man;Invincible;Avatar Aang;Anime

# Pick the shader preset from the power source: the full Anime4K chain on AC,
# a light one on battery. Set to no to always use the full chain.
#
# Why: measured 2026-09-08 on battery at 3456x2168 fullscreen (1080p HEVC),
# three focus-gated samples per chain in one run. Frames dropped:
#     full 43.9%      light 0.5%      shaders off ~0%
# So light costs essentially nothing in dropped frames and still does a real CNN
# upscale. (A middle option keeping the VL upscale dropped 11.8% and was
# rejected - the VL upscale is the expensive part, not the Restore stage.)
# Measure this with frame-drop-count over wall-clock, NOT with per-stage
# vo-passes timings (they charge the cost to the wrong pass), and only while mpv
# HAS FOCUS - unfocused, macOS stops compositing it and every chain reads 0%.
power_aware=yes

# Which Anime4K chain to use on WALL POWER: light or full.
#
# Changed to light on 2026-09-20. The full chain only stays clean on a machine
# that is otherwise idle, and this one usually is not once it is plugged in -
# macOS releases the background work it holds back on battery as soon as the
# cable goes in. Measured that day with no player open at all: mediaanalysisd
# at ~60% CPU with the hardware decoder pegged beside it, and the GPU already
# at 24% utilisation. On top of that the full chain wants 76-77% and 1080p
# anime visibly stutters.
#
# What it costs: on the same machine and file, off 36% / light 37% / full
# 76-77% GPU. So light is within noise of running no shaders at all, and it is
# still a real CNN upscale - it drops the Restore stage and the VL upscale and
# keeps the M upscale. Set this to full if you want the sharpest picture back
# and the machine is quiet.
#
# NOTE: this is NOT load-aware. It reads the power cable, not the GPU, so it
# will not switch back to full on its own when the machine goes idle.
ac_chain=light

# Seconds between power-source checks. Only polled while the shaders are
# actually in use, so an idle player costs nothing. Also the worst-case delay
# before unplugging takes effect.
power_poll_seconds=30

# Frame pacing to use on battery, or leave the value empty to always keep the
# one mpv.conf sets. This applies to EVERY video, not just animation, and it is
# the single biggest saving of the two.
#
# mpv.conf sets video-sync=display-resample, which locks playback to the
# display clock. That removes a small hitch every ~8 seconds, but it makes the
# GPU redraw at the SCREEN's rate rather than the video's - this panel refreshes
# 120 times a second for a film with 24 new frames a second, so four out of
# every five trips through the scaler and the shaders redraw a frame that is
# already on screen. video-sync=audio feeds the same frames through the same
# scaler and the same shaders, so the picture is identical; it just stops
# paying for the repeats.
#
# Measured 2026-09-10 on Attack on Titan (1080p HEVC), fullscreen 3456x2168,
# mpv focused, three 12 s samples per row, median GPU "Device Utilization %":
#             display-resample   audio
#   no shaders   33 / 37 / 37     11 / 11 / 11
#   light preset 37 / 37 / 37     17 / 17 / 18.5
# Zero dropped frames in all twelve samples. So on the battery preset this
# roughly halves the GPU work for the same picture.
#
# The cost is the hitch coming back: 120 / 23.976 = 5.005, so about every 8
# seconds one frame is held an extra refresh. Set this empty if you would
# rather have the smoothness and take the shorter battery life.
battery_video_sync=audio
