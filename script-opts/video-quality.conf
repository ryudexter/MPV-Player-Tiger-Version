# Which videos get the sharper-picture shaders (see scripts/video-quality.lua).
#
# Semicolon-separated. Each entry is matched as plain text anywhere in the
# file's full path, ignoring case, so a folder name on its own is enough.
# Add a line's worth of text here when a new animated series joins the library.
#
# NOTE: no spaces around the '=' - mpv silently ignores "key = value".
animation_paths=Solo Leveling;Attack on Titan;One Punch Man;Invincible;Avatar Aang;Anime

# Whether the cable is consulted at all. With this off, the wall-power ceiling
# (ac_max_chain) applies everywhere and battery_chain is ignored.
#
# Why: measured 2026-09-08 on battery at 3456x2168 fullscreen (1080p HEVC),
# three focus-gated samples per chain in one run. Frames dropped:
#     full 43.9%      light 0.5%      shaders off ~0%
# So light costs essentially nothing in dropped frames and still does a real CNN
# upscale. (A middle option keeping the VL upscale dropped 11.8% and was
# rejected - the VL upscale is the expensive part, not the Restore stage.)
# Measure this with frame-drop-count over wall-clock, NOT with per-stage
# vo-passes timings (they charge the cost to the wrong pass), and only while mpv
# HAS FOCUS - unfocused, macOS stops compositing it and every chain reads 0%.
power_aware=yes

# ---- what runs, and when ---------------------------------------------------
# The shaders are now a LADDER of three rungs - full, light, off - and what runs
# is whichever rung the machine has most recently shown it can afford. These two
# settings are the ends of that ladder, not fixed choices.

# The best chain the ladder may climb to on wall power: light or full.
ac_max_chain=full

# What to use on battery: off, light or full.
#
# Off by default as of 2026-09-20. The full chain drops 43.9% of frames
# unplugged (measured - see the table in video-quality.lua) and even the light
# one is GPU drawn straight out of the battery for a picture you never asked
# for. Pressing y to "always on" still overrides this and gives you the light
# chain; this is only what happens when nobody has said anything.
battery_chain=off

# ---- the load ladder -------------------------------------------------------
# Climb while the machine can afford it, step down when it cannot. Set to no to
# pin the chain to ac_max_chain / battery_chain and never move.
#
# The signal is mpv's OWN dropped-frame counters, not a GPU meter. Two reasons,
# both of them load-bearing:
#
#   1. It costs no fork. A load monitor has to sample every few seconds to be
#      any use, and a periodic fork under live audio is the bug that caused the
#      thump (see the note above refresh_power in video-quality.lua). Reading
#      frame-drop-count is in-process and free.
#   2. It measures the symptom, not a proxy. Whatever is taking the machine -
#      another app, a background index, thermal throttling - shows up here as
#      dropped frames, and a chain that cannot be afforded convicts itself.
#
# Caught 2026-09-20 with no player open at all: mediaanalysisd at ~60% CPU with
# the hardware decoder pegged beside it for 41 hours, and the GPU already at 24%
# utilisation. That is the state this ladder exists to notice, and plugging in
# is what causes it - macOS releases the background work it holds back on
# battery the moment the cable goes in.
load_aware=yes

# Length of each measuring window, in seconds. At 23.976 fps a 10 s window is
# about 240 frames, so the 2% threshold below is roughly 5 dropped frames -
# a real signal rather than noise. Shorter windows convict on nothing.
load_window_seconds=10

# Step DOWN a rung when this fraction of a window's frames is lost.
load_down_fraction=0.02

# Step UP only while losses stay under this. The gap between the two thresholds
# is deliberate: in between, the ladder holds where it is instead of
# oscillating around a single number.
load_up_fraction=0.005

# Seconds of continuous clean playback before climbing a rung. Climbing
# recompiles the shaders, which is a visible hitch, so climbing is slow on
# purpose while stepping down is immediate. A rung that fails straight after
# being climbed to doubles its own wait, capped at 8x - so the longest retry
# interval is 8 minutes at this setting.
load_up_after_seconds=60

# Seconds between power-source checks. Only polled while the shaders are
# actually in use, so an idle player costs nothing. Also the worst-case delay
# before unplugging takes effect.
power_poll_seconds=30

# Frame pacing to use on battery, or leave the value empty to always keep the
# one mpv.conf sets. This applies to EVERY video, not just animation, and it is
# the single biggest saving of the two.
#
# mpv.conf sets video-sync=display-resample, which locks playback to the
# display clock. That removes a small hitch every ~8 seconds, but it makes the
# GPU redraw at the SCREEN's rate rather than the video's - this panel refreshes
# 120 times a second for a film with 24 new frames a second, so four out of
# every five trips through the scaler and the shaders redraw a frame that is
# already on screen. video-sync=audio feeds the same frames through the same
# scaler and the same shaders, so the picture is identical; it just stops
# paying for the repeats.
#
# Measured 2026-09-10 on Attack on Titan (1080p HEVC), fullscreen 3456x2168,
# mpv focused, three 12 s samples per row, median GPU "Device Utilization %":
#             display-resample   audio
#   no shaders   33 / 37 / 37     11 / 11 / 11
#   light preset 37 / 37 / 37     17 / 17 / 18.5
# Zero dropped frames in all twelve samples. So on the battery preset this
# roughly halves the GPU work for the same picture.
#
# The cost is the hitch coming back: 120 / 23.976 = 5.005, so about every 8
# seconds one frame is held an extra refresh. Set this empty if you would
# rather have the smoothness and take the shorter battery life.
battery_video_sync=audio
