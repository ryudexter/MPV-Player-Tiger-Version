# Options for scripts/webm.lua (ekisu/mpv-webm). Only the lines that differ
# from upstream's defaults are set here; everything else is left alone.

# Cmd+T opens the clip menu. Asked for 2026-09-03 - it is the shortcut the
# user already has the muscle memory for.
#
# Free at both levels, which both had to be checked: nothing in input.conf
# binds Meta+t, and mpv's own macOS menu bar does not claim it either. That
# second check matters because AppKit eats a menu key equivalent before mpv's
# input layer ever sees it. Read off v0.41.0's osdep/mac/menu_bar.swift, the
# menu takes Cmd plus , h q o O w z Z x c v a 0 1 2 m - no t.
keybind=Meta+t

# LOCAL: absolute path to the encoder binary. Upstream spawns bare "mpv" and
# relies on PATH; mpv.app is launched by Finder, which passes none, so the
# encode fails silently under the app bundle. Same trap, and same fix, as
# thumbfast.conf's mpv_path.
# On Windows and Linux this path does not exist and webm.lua falls back to a
# bare "mpv" (a LOCAL patch there), which finds the running mpv by itself.
mpv_path=/opt/homebrew/bin/mpv

# Clips land on the Desktop rather than next to the source file, which would
# otherwise scatter mp4s through the library.
# ~~desktop/ is mpv's name for the Desktop, which is ~/Desktop on a Mac but can
# be OneDrive\Desktop on Windows or a translated folder on Linux (Masaustu,
# Bureau). Was ~/Desktop until the Windows/Linux port; webm.lua's parse_directory
# has a LOCAL patch so it understands the ~~ form.
output_directory=~~desktop/

# h264 + AAC in an .mp4. Upstream defaults to VP8 in .webm, which AirDrop,
# Messages, Photos and iOS all handle badly. mp4 plays everywhere.
output_format=avc

# 0 disables bitrate targeting and hands quality to the CRF below. Upstream's
# 2500 kB cap is a Discord-attachment default that visibly wrecks anything
# longer than about twenty seconds.
target_filesize=0

# x264's quality scale, where lower is better and 18-23 is the usual range.
# Upstream's 10 is tuned for VP8/VP9 and is near-lossless for x264, producing
# enormous files.
crf=20

# Two passes only exist to hit a bitrate target, and there is no target now.
# Turning it off halves the encode time.
twopass=no
